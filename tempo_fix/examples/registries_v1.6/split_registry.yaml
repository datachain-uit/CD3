scheme_version: v2_family_shared_calendar
scenario: hybrid
scheme: 'A = offerings ending on or before a_boundary (CQ anchor: earliest 60% CQ
  enrollments by offering_end_date); future pool cut at explicit calendar boundaries
  into T1, T2, T3; inside each slice whole units are paired into VALIDATION/TEST blocks
  (T1->B,C; T2->D,E; T3->F,G) with tempo_fix.split_v2._greedy_pair_split'
unit: offering_id x timeline_source; a unit is never split across blocks; an enrollment
  belongs to exactly one block
windows:
  W1:
  - A
  - B
  - C
  W2:
  - A+B+C
  - D
  - E
  W3:
  - A+B+C+D+E
  - F
  - G
calendar:
  anchor_task: CQ
  a_boundary: '2020-07-31'
  slice_boundaries:
    T1: '2020-09-13'
    T2: '2020-12-31'
    T3: '2022-01-18'
  tau_w:
    W1: '2020-07-31'
    W2: '2020-09-13'
    W3: '2020-12-31'
  slice_calendar_days:
    T1: 44
    T2: 109
    T3: 383
  source: '[CL §2 boundaries], [V3 §5 tau_w]; both tasks use the same four dates'
temporal_rule: 'LABEL_TIME_ORDERING: tau_w = latest TRAIN offering_end_date <= earliest
  VALIDATION/TEST offering_end_date in every window'
qa22:
  hard:
  - end_order_ok
  - eval_size_ok
  min_eval_enrollments: 1
  reported_only:
  - ev_train_overlap_share
  - p1_cutoff_overlap_share
  - days_train_end_to_test_start
  - temporal_strict_share_P1_P4
  revised_on: '2026-09-28'
  locked_on: '2026-09-30'
  reason: 'SPLIT_V2_QA_INCIDENT_REPORT: concurrent offerings make any start-date purge
    remove 90-100% of the evaluation sets; overlap is inherent to MOOC data and is
    analysed as a slice'
overlap_metrics:
  ev_train_overlap_share: share of evaluation enrollments whose offering_start_date
    < tau_w (offering-start based) [CL §3]
  p1_cutoff_overlap_share: '1 - temporal_strict_share(P1, split): share whose P1 cutoff
    < tau_w [CL §3]'
  rule: both columns are kept; neither replaces the other
purge_mode: NONE
sensitivity_exclusions:
- TEST_SIDE_PURGE
- TRAIN_EMBARGO
embargo_gap_days: 0
temporal_slice:
  subgroup_axis: TEMPORAL
  values:
  - STRICT
  - OVERLAP
  rule: STRICT when cutoff_k(e) = enroll_time + q_k*(offering_end_date - enroll_time)
    >= tau_w; computed per (enrollment, phase) from stored predictions; reported for
    every run and every phase P1-P4; not part of the five mandatory meta-model subgroups;
    empty slice -> NULL with SLICE_EMPTY
long_offering:
  decision: KEEP_UNITS
  decided_on: '2026-09-30'
  source: '[V3 §8]'
  threshold_days: 270
  context_columns:
  - timeline_source
  - duration_days
  - long_offering_flag
  no_new_mandatory_subgroup: true
  evidence:
    course_specific_timeline:
      p50: 121
      p90: 345
      max: 506
      enrollment_share_gt_270d: 0.01457
    global_template_fallback:
      p50: 127
      p90: 426
      max: 481
      enrollment_share_gt_270d: 0.55124
    enrollment_anchored_proxy:
      p50: 152
      p90: 212
      max: 212
      enrollment_share_gt_270d: 0.0
