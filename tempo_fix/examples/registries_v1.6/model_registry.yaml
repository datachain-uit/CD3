- model_name: MANTIS_V2
  model_tier: F3_TS_FOUNDATION
  model_family: MANTIS
  variant_role: EXPLORATORY
  is_pretrained: 1
  finetune_mode: LINEAR_PROBE
  encoder_frozen: 1
  pretrained_repo: paris-noah/MantisV2
  pretrained_revision: 8f6ca35cb54ab14b120618943c6fca5ddf5a76a6
  pretrained_revision_note: Hugging Face API read on 2026-11-06 (lastModified 2026-08-21T09:56:46Z,
    card licence apache-2.0, safetensors 4,188,690 values); the pilot re-reads the
    sha and records the snapshot file sha256 (check 37 (a))
  library: mantis-tsfm==1.1.0
  library_revision: mantis-tsfm 1.1.0, wheel sha256 accdaf2e44d263b23913fc914e00d5d0d37d41d70590ba34d70883f21b40a55f
  licence: Apache-2.0 (PyPI package; model-card metadata at the pinned revision)
  pretraining_data: synthetic only (CauKer, 2 million series), so no overlap with
    MOOCCubeX is possible
  references:
  - 'Feofanov et al., Mantis: Lightweight Foundation Model for Time Series Classification,
    ICML 2026, PMLR 306:30692-30719'
  - Feofanov et al., MantisV2, arXiv:2602.17868 (2026)
  param_count_backbone_total: 4188672
  param_count_backbone_used: 2214144
  return_transf_layer: 2
  output_token: combined
  embedding_dim_per_series: 512
  num_patches: 32
  interp_len: 512
  interp_mode: linear
  interp_align_corners: false
  interp_constant_rows: a component whose k values are all equal is replicated exactly
    instead of interpolated (keeps the constant-series guard exact on kernels that
    compute w0 x0 + w1 x1, such as CUDA)
  input_encoding: PCA8_PER_PHASE_THEN_LINEAR_RESIZE_512_v1
  channel_adapter:
    method: PCA_ACROSS_CHANNELS
    n_components: 8
    standardize: true
    fit_rows: REAL_TRAIN_ROWS_ONLY
    fit_vectors: every phase step of the selected rows (P1..P4 pooled)
    sample_rows_max: 1000000
    sample_seed: 20260922
    solver: eigh of the float64 covariance of standardised channels
    sign_rule: 'largest absolute loading of every component is positive (ties: lowest
      channel index)'
    fit_order: rows sorted by row id before sampling and accumulation (independent
      of the frame order); sha256 of the fitted rows stored with the adapter and checked
      by later imputer-only cells
  constant_series_rtol: 1.0e-06
  constant_series_guard: 'instance normalisation returns exact zeros when std <= 1e-6
    * (|mean| + 1e-6) over the resized series (rule of MOMENT revision v2_1); bit-identical
    to the official expression otherwise; measured without the guard on CPU: pseudo-signal
    0.0015 for a constant 0.1 and 0.046 for a constant 3.3'
  embedding_reduction: concatenate the 8 component embeddings (8 x 512 = 4096 values
    per row and prefix)
  head_inputs:
  - standardised MantisV2 embeddings (4096)
  - standardised static block
  - phase one-hot (4)
  head: Dropout(0.3) + Linear(4096 + static_dim + 4 -> 3); one head for P1..P4
  embedding_cache:
    level_A: 'per (task, window, imputer pipeline, adapter digest): REAL_TRAIN, VALIDATION,
      TEST'
    level_B: 'per (task, window, balanced pipeline, master seed): synthetic TRAIN
      rows only'
    fallback: CELL_TRAIN when the real rows of a balanced cell differ from the imputer-only
      TRAIN (ids or input sha256)
    dtype: float16
    key: adapter digest + encoder fingerprint (sha256 of the truncated backbone weights,
      encoding settings, precision, microbatch, device)
    reuse_rule: every entry (level A, level B, CELL_TRAIN) is reused only when ids
      and the sha256 of its input tensor match; an existing entry built from other
      rows stops the run
  weight_loading: strict key-by-key load of the pinned snapshot (state dict 4,188,690
    values); run_cell refuses a random-weight backbone
  microbatch_sequences: 4096
  attention_backend: MATH (scoped torch.nn.attention.sdpa_kernel)
  backbone_precision: bf16 autocast on CUDA; embeddings stored as float16; head in
    fp32
  model_revision: mantisv2_frozen_linear_probe_v1_pca8_interp512
  hparam_config_id: HP_MANTISV2_FROZEN_LINEAR_PROBE_v1_pca8
  max_seq_len: 4
  patch_len: 16
  patch_stride: 16
  cost_note_2026-11-06: 'one backbone series costs 160.7 MFLOPs (torch.utils.flop_counter,
    truncated network, 512 points), the same order as MOMENT-1-small under phase-as-patch
    (40-80 MFLOPs per token x 4 tokens); the saving comes from the 8-component adapter
    (CQ: 274 channels -> 8, 34x fewer series) and from the cache, not from the backbone;
    CQ W1 REAL_TRAIN = 1,609,276 rows x 8 x 4 = 51.5 million series per pass; cache
    52.7 GB float16'
  implementation: 'writing-side package f3_mantis 0.1.0 (working/Data and Code/f3_mantis_v0.1.0_2026-11-06,
    33 tests + 1 registry test; independent code review on 2026-11-06 before delivery:
    every cache entry verified by ids and input sha256 and keyed by the encoder fingerprint,
